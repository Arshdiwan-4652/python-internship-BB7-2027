{% extends "base.html" %}
{% block title %}Add Book | Library{% endblock %}
{% block page_title %}Add New Book{% endblock %}
{% block content %}
<section class="panel form-panel">
    <form method="post" class="form-grid">
        <label>Book Title <input type="text" name="title" required></label>
        <label>Author Name <input type="text" name="author" required></label>
        <label>Category <input type="text" name="category"></label>
        <label>ISBN <input type="text" name="isbn"></label>
        <label>Quantity <input type="number" name="quantity" min="0" required></label>
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Add Book</button>
            <a class="btn btn-secondary" href="{{ url_for('books') }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
